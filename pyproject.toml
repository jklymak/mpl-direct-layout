[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpl-direct-layout"
version = "0.1.0"
description = "A kiwisolver-free layout engine for Matplotlib"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["matplotlib", "layout", "axes", "figure"]
authors = [
    { name = "Jody Klymak", email = "jklymak@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-mpl"]
docs = ["sphinx", "sphinx-rtd-theme", "numpydoc"]

[project.urls]
Repository = "https://github.com/jklymak/mpl-direct-layout"

[tool.hatch.build.targets.wheel]
packages = ["src/mpl_direct_layout"]

[tool.pytest.ini_options]
addopts = "--mpl-default-tolerance=2 --mpl-baseline-path=tests/baseline_images"
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
mpl-direct-layout = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.11.*"
matplotlib = ">=3.11.0,<4"
numpy = ">=2.4.6,<3"
pytest = ">=9.1.1,<10"
pytest-mpl = ">=0.19.0,<0.20"
